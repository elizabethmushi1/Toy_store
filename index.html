<!DOCTYPE html>
<html>
<head>
  <title>Toys</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="toyhead">
    <h1>Toy Store</h1>
    <p>Fun for all ages</p>
  </div>
  <div class="toycontainer">
    <div class="toyleft">
      <img src="teddy.jpg" alt="teddy">
    </div>
    <div class="toyright">
      <h3>Teddy Bear</h3>
      <p>Soft and cuddly friend</p>
      <p class="price">$15.99</p>
      <button>Add to Cart</button>
    </div>
  </div>
  <div class="toyfoot">Free gift wrapping</div>
</body>
</html>
